<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bingwa favicon</title>
<desc>Simplified circular emblem: sunset gradient, Kilimanjaro peaks, acacia tree and a plane trail, for use as a small favicon icon.</desc>

<defs>
  <linearGradient id="favSunset" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EFB96A"/>
    <stop offset="45%" stop-color="#C48A3C"/>
    <stop offset="100%" stop-color="#7A3428"/>
  </linearGradient>
  <clipPath id="favClip">
    <circle cx="128" cy="128" r="120"/>
  </clipPath>
</defs>

<circle cx="128" cy="128" r="124" fill="#152018"/>

<g clip-path="url(#favClip)">
  <rect x="0" y="0" width="256" height="256" fill="url(#favSunset)"/>

  <!-- Sun -->
  <circle cx="128" cy="108" r="34" fill="#F8EFDD"/>

  <!-- Kilimanjaro twin peaks -->
  <polygon points="80,196 112,140 148,196" fill="#152018" opacity="0.85"/>
  <polygon points="128,196 168,120 208,196" fill="#152018"/>
  <polygon points="168,120 180,142 156,142" fill="#F6EFE0"/>

  <!-- Ground -->
  <rect x="0" y="196" width="256" height="60" fill="#152018"/>

  <!-- Acacia tree -->
  <g fill="#152018">
    <rect x="58" y="168" width="4" height="30"/>
    <ellipse cx="60" cy="162" rx="24" ry="8"/>
  </g>

  <!-- Plane trail -->
  <path d="M 50 68 Q 128 30 206 72" fill="none" stroke="#F8EFDD" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <g transform="translate(196,68) rotate(22)">
    <path d="M0,0 L16,0 L22,3 L16,6 L10,4.5 L2,7 L-1,7 L2,3 L-3,3 Z" fill="#F8EFDD"/>
  </g>
</g>

<circle cx="128" cy="128" r="120" fill="none" stroke="#C48A3C" stroke-width="6"/>

</svg>
